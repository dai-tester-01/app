[tool.poetry]
name = "litellm-model-comparator"
version = "0.1.0"
description = "Compare LLM responses, latency, tokens, cost, and optional judge scores."
authors = ["School Project <student@example.com>"]
readme = "README.md"
packages = [{ include = "model_comparator", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
jinja2 = "^3.1.0"
python-multipart = "^0.0.12"
pydantic-settings = "^2.6.0"
litellm = "^1.60.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
